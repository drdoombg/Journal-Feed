<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="description" content="Daily feed of the best new papers from the world's top journals.">
<title>Journal Feed</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">◉</span>
    <div>
      <div class="title">Journal Feed</div>
      <div class="sub" id="sub">loading…</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on">Today</button>
    <button data-tab="fund">Fundamentals</button>
    <button data-tab="domains">Domains</button>
    <button data-tab="archive">Archive</button>
    <button data-tab="retro">Retro</button>
    <button data-tab="saved">Saved</button>
    <button data-tab="settings" aria-label="Settings">⚙</button>
  </nav>
</header>

<main id="main"></main>
<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>

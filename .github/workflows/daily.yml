name: Daily feed

on:
  schedule:
    - cron: "50 3 * * *"        # 03:50 UTC daily (GitHub may delay a little); commentary follows at 04:37 London
  workflow_dispatch:
    inputs:
      retro:
        description: "Retro pass (auto runs on the 1st of the month)"
        type: choice
        options: [auto, monthly, quarterly, none]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and rank today's papers
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch.py --retro "${{ github.event.inputs.retro || 'auto' }}"

      - name: Commit
        run: |
          git config user.name  "journal-feed-bot"
          git config user.email "journal-feed-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "feed: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

name: Daily feed

on:
  schedule:
    # GitHub sometimes drops scheduled runs, so try three times; later runs skip if today is already done.
    # Midnight fetch with two backups, all before 02:00 UK time (UTC; 1h later in BST).
    - cron: "5 0 * * *"
    - cron: "41 0 * * *"
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      retro:
        description: "Retro pass (auto runs on the 1st of the month)"
        type: choice
        options: [auto, monthly, quarterly, none]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's feed already exists (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/days/$(date -u +%F).json" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Today's feed already exists."
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Fetch and rank today's papers
        if: steps.guard.outputs.skip != '1'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch.py --retro "${{ github.event.inputs.retro || 'auto' }}"

      - name: Commit
        if: steps.guard.outputs.skip != '1'
        run: |
          git config user.name  "journal-feed-bot"
          git config user.email "journal-feed-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -m "feed: $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
